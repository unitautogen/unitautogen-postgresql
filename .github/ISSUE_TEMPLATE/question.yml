name: Question / help
description: Ask how to do something with UnitAutogen.
title: "[Question]: "
labels: ["question"]
body:
  - type: markdown
    attributes:
      value: |
        Please check the [documentation](https://github.com/unitautogen/unitautogen-postgresql/tree/main/docs)
        first, especially the [FAQ](https://github.com/unitautogen/unitautogen-postgresql/blob/main/docs/faq.md).
        For licensing or account questions, email licensing@unitautogen.com.
  - type: textarea
    id: question
    attributes:
      label: Your question
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: UnitAutogen version (if relevant)
      placeholder: 0.5.1-beta
