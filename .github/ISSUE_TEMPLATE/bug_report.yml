name: Bug report
description: Something went wrong when running UnitAutogen.
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for helping improve UnitAutogen. Please do not paste real production data or secrets.
        A small, made-up schema that reproduces the problem is the most useful thing you can give us.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: What did you expect, and what actually happened instead?
      placeholder: The run stopped with ... / the coverage came out as ...
    validations:
      required: true
  - type: input
    id: command
    attributes:
      label: Command you ran
      placeholder: unitautogen --schema public --out unit_tests --html report.html
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: UnitAutogen version
      placeholder: 0.3.2-beta
    validations:
      required: true
  - type: dropdown
    id: os
    attributes:
      label: Operating system
      options:
        - Windows
        - Linux
        - Other
    validations:
      required: true
  - type: input
    id: pg
    attributes:
      label: PostgreSQL version
      placeholder: "16.3"
    validations:
      required: true
  - type: input
    id: exts
    attributes:
      label: pgTAP and plpgsql_check versions
      description: "Run: SELECT extname, extversion FROM pg_extension WHERE extname IN ('pgtap','plpgsql_check');"
      placeholder: "pgtap 1.3.4, plpgsql_check 2.8"
  - type: textarea
    id: repro
    attributes:
      label: Minimal reproduction (optional, but very helpful)
      description: A small function or schema, with no real data, that shows the problem.
      render: sql
  - type: textarea
    id: output
    attributes:
      label: Relevant output or error
      render: shell
